name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create test environment
        run: |
          cp .env.example .env
          sed -i 's/<REDACTED>/test-value/g' .env
          echo "ETHERSCAN_API_KEY=TESTKEY" >> .env
          echo "GOOGLE_API_KEY=TESTKEY" >> .env
          echo "SECRET_KEY=test-secret-key-32-chars-minimum!!" >> .env
          echo "TESTING=true" >> .env
          mkdir -p data

      - name: Run tests
        run: pytest backend/tests/ -v --tb=short --cov=backend --cov-report=term-missing

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - name: Ruff check
        run: ruff check backend/ --output-format=github