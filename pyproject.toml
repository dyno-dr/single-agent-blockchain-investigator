# pyproject.toml
# ─────────────────────────────────────────────────────────────────────────────
# Single-Agent Blockchain Investigator
# Tool configuration: pytest, ruff (linter/formatter), mypy (type checker)
#
# Design decisions:
#   - pytest is configured to auto-discover backend/tests/, require asyncio
#     mode for async test functions, and output a coverage report for the
#     backend package.
#   - ruff replaces flake8 + isort + pyupgrade in one pass. Rules are
#     conservative for this research codebase: E/W (pycodestyle), F (pyflakes),
#     I (isort), UP (pyupgrade), B (flake8-bugbear), and ANN (annotations).
#   - mypy uses strict mode minus a few pragmatic relaxations for the
#     research phase (no-strict-optional, allow-untyped-calls for LangGraph).
# ─────────────────────────────────────────────────────────────────────────────

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "single-agent-blockchain-investigator"
version = "1.0.0"
description = "AI-powered forensic analysis of Ethereum wallet activity"
requires-python = ">=3.12"
readme = "README.md"


# ─────────────────────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
# Root dir for test discovery
testpaths = ["backend/tests"]

# Enable asyncio mode so `async def test_*` functions work without
# explicit @pytest.mark.asyncio decorators on every test.
asyncio_mode = "auto"

# Default addopts:
#   -v          verbose output (one line per test)
#   --tb=short  short traceback on failure (not full)
#   -p no:cacheprovider  disable .pytest_cache writes in CI
addopts = """
    -v
    --tb=short
    --strict-markers
    -p no:cacheprovider
"""

# Coverage configuration (activated via: pytest --cov=backend --cov-report=term-missing)
# The --cov flags are NOT in addopts to keep plain `pytest` fast.
# Use `pytest --cov=backend --cov-report=term-missing` for coverage runs.

# Custom marks used in the test suite
markers = [
    "unit: pure unit tests — no I/O, no network, no DB",
    "integration: integration tests — may use DB or mock network",
    "slow: tests that take >1 second (skipped in fast CI runs)",
    "persistence: tests for the database/repository layer",
    "blockchain: tests requiring Etherscan mock fixtures",
    "agent: tests for the LangGraph agent layer",
]

# Warning filters — suppress known noisy deprecation warnings
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*:",
    "ignore::DeprecationWarning:starlette.*:",
    "ignore::PendingDeprecationWarning",
]

# Minimum coverage threshold (enforced with --cov-fail-under=80)
# Uncomment when coverage is stabilised:
# [tool.coverage.report]
# fail_under = 80


# ─────────────────────────────────────────────────────────────────────────────
# Coverage (pytest-cov)
# ─────────────────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/tests/*",
    "backend/*/migrations/*",
    "**/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]


# ─────────────────────────────────────────────────────────────────────────────
# ruff — linter and formatter
# ─────────────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking (move type-only imports to TYPE_CHECKING)
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter
    "E741",   # ambiguous variable names — ok in test scopes
    "B008",   # do not perform function calls in default arguments
              # (FastAPI's Depends() pattern requires this)
    "B904",   # within an except clause, raise from (too strict for research)
    "B017",   # pytest.raises(Exception) — pragmatic for research code
    "UP007",  # use X | Y instead of Optional[X] (gradual migration)
    "SIM102", # nested if statements — code structure preferences
    "SIM105", # try-except-pass vs suppress — code style preference
    "SIM117", # use single with statement (conflicts with nested async context)
    "RUF001", # ambiguous characters in strings — cosmetic, from copied text
    "RUF005", # iterable unpacking — style preference
    "RUF012", # mutable class attributes should use field() — pydantic handles this
    "TC001",  # type-checking imports — requires refactoring, addressed in next phase
    "TC002",  # type-checking imports — requires refactoring, addressed in next phase
    "TC003",  # type-checking imports — requires refactoring, addressed in next phase
    "RUF002", # ambiguous characters in docstrings — cosmetic, addressed in next phase
    "RUF003", # ambiguous characters in docstrings — cosmetic, addressed in next phase
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
# Tests can use assert statements, magic values, and unused imports
"backend/tests/**/*.py" = ["S101", "PLR2004", "F401", "ANN"]
# __init__.py files are allowed to have unused imports (re-exports)
"**/__init__.py" = ["F401"]


# ─────────────────────────────────────────────────────────────────────────────
# mypy — static type checker
# ─────────────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
mypy_path = "."
packages = ["backend"]

# Strictness — pragmatic settings for a research codebase
strict = false                    # enable selectively below
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = false     # too strict for early-phase code
no_implicit_optional = true
strict_optional = true

# Import resolution
ignore_missing_imports = true     # LangGraph, aiosqlite stubs may be absent

[[tool.mypy.overrides]]
module = "backend.tests.*"
disallow_untyped_defs = false
ignore_errors = false

[[tool.mypy.overrides]]
# LangGraph has limited type stubs in early versions
module = ["langgraph.*", "langchain.*", "langchain_core.*", "langchain_anthropic.*"]
ignore_missing_imports = true